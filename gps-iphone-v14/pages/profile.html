<form id="settings-form" class="pro-form">
    <div class="input-group">
        <label>Ім'я</label>
        <input type="text" id="set-firstName" placeholder="Ім'я" required>
    </div>
    <div class="input-group">
        <label>Прізвище</label>
        <input type="text" id="set-lastName" placeholder="Прізвище" required>
    </div>
    <div class="input-group">
        <label>Клуб / Команда</label>
        <input type="text" id="set-club" placeholder="Твій клуб">
    </div>
    <div class="input-group">
        <label>Країна</label>
        <select id="set-country">
            <option value="Germany">Німеччина</option>
            <option value="Ukraine">Україна</option>
            <option value="Cyprus">Кіпр</option>
        </select>
    </div>
    <button type="submit">Зберегти зміни</button>
</form>
