<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProAthleteCare | Access Required</title>
  <style>
    :root {
      --bg: #050505;
      --card: #111214;
      --line: #24262a;
      --text: #f4f4f4;
      --muted: #b9bcc3;
      --gold: #ffc72c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at top, #1a1510 0%, var(--bg) 45%);
      color: var(--text);
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(560px, 100%);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--gold);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 12px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: 0.01em;
    }
    p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 15px;
    }
    .actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #17191d;
      color: var(--text);
      text-decoration: none;
      padding: 11px 14px;
      font-weight: 700;
    }
    .btn.primary {
      border-color: #a07908;
      background: linear-gradient(180deg, #ffd24e 0%, #ffc72c 100%);
      color: #121212;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">ProAthleteCare Mobile</p>
    <h1>Access Is Currently Inactive</h1>
    <p>
      Your app account is active, but training access is currently restricted for this profile.
      Please contact support or your coach to reactivate your plan.
    </p>
    <p>
      Support: <a href="mailto:proathletecare@gmail.com">proathletecare@gmail.com</a>
    </p>
    <div class="actions">
      <a id="goDashboard" class="btn primary" href="/ProAthleteCare-1/gps-iphone-v14/pages/dashboard_user.html">Try Dashboard Again</a>
      <a class="btn" href="/ProAthleteCare-1/gps-iphone-v14/pages/regist.html">Open Login</a>
    </div>
  </main>
  <script>
    (function preserveAppModeQuery() {
      try {
        const current = new URLSearchParams(window.location.search || "");
        const out = new URLSearchParams();
        if (current.get("mobile") === "1") out.set("mobile", "1");
        if (current.get("app") === "1" || current.get("mobile") === "1") out.set("app", "1");
        ["appv", "uid", "channel"].forEach(function (key) {
          const value = String(current.get(key) || "").trim();
          if (value) out.set(key, value);
        });
        const qs = out.toString();
        if (qs) {
          const link = document.getElementById("goDashboard");
          if (link) link.setAttribute("href", "/ProAthleteCare-1/gps-iphone-v14/pages/dashboard_user.html?" + qs);
        }
      } catch {}
    })();
  </script>
</body>
</html>
